<!DOCTYPE html>
<html lang="pt-MZ">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Homem e a Máquina</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


    <div class="app">


        <!-- =========================
             TOPO
        ========================== -->

        <header class="top-area">

            <div class="hm-logo">
                HM
            </div>


            <button
                type="button"
                class="settings-button"
                aria-label="Definições"
            >
                ⚙️
            </button>

        </header>



        <!-- =========================
             CENTRO
        ========================== -->

        <main class="center-area">

            <!-- A Máquina será colocada aqui
                 depois de a estrutura passar no teste -->

        </main>



        <!-- =========================
             CONTROLES
        ========================== -->

        <footer class="controls-area">


            <button
                type="button"
                class="voice-button"
                aria-label="Falar com a Máquina"
            >
                🎙️
            </button>


            <button
                type="button"
                class="keyboard-button"
                aria-label="Abrir teclado"
            >
                ⌨️
            </button>


        </footer>


    </div>


    <script src="js/app.js"></script>


</body>

                </html>
